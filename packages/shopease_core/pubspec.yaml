name: shopease_core
description: "Shared domain models, repository contracts and utilities for ShopEase."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.13.7
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  go_router: ^18.1.1
  google_fonts: ^6.2.1
  iconsax_plus: ^1.0.0
  lottie: ^3.1.3
  shared_preferences: ^2.5.6

  # Firebase
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  google_sign_in: ^7.2.0
  
  skeletonizer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/lottie/
    - assets/images/
